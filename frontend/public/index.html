<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- PWA Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="DevChat Pro" />
    
    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevChat Pro" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="apple-touch-startup-image" href="/logo512.png" />
    
    <!-- Windows Specific -->
    <meta name="msapplication-TileColor" content="#00a884" />
    <meta name="msapplication-TileImage" content="/logo192.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Theme Color for All Browsers -->
    <meta name="theme-color" content="#00a884" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b141a" media="(prefers-color-scheme: dark)" />
    <!-- Fallback for browsers that do not support media attribute -->
    <meta name="theme-color" content="#00a884" />
    <script>
      (function() {
        var darkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var metaThemeColor = document.querySelector('meta[name="theme-color"]:not([media])');
        if (metaThemeColor) {
          if (darkScheme) {
            metaThemeColor.setAttribute('content', '#0b141a');
          } else {
            metaThemeColor.setAttribute('content', '#00a884');
          }
        }
      })();
    </script>
    
    <!-- Fonts - ADD THESE LINES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Performance & Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    
    <!-- Behavior -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />
    <meta name="format-detection" content="email=no" />
    
    <!-- SEO & Social -->
    <meta name="description" content="DevChat Pro - Feature-rich real-time chat application with voice messages, reactions, and more. Works on Windows, Android, iOS, and macOS." />
    <meta name="keywords" content="chat, messaging, real-time, voice messages, reactions, cross-platform" />

    <!-- Add these meta tags for better mobile experience -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Add these for better call/stream performance -->
    <meta http-equiv="Content-Security-Policy" content="default-src *; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src *; media-src *; img-src * data: blob:; style-src * 'unsafe-inline';" />

    <!-- Add these for better WebRTC support -->
    <meta name="format-detection" content="telephone=no" />

    <meta name="author" content="DevChat Pro" />
    
    <title>DevChat Pro</title>
    
    <style>
      html, body { 
        width: 100%; 
        height: 100%; 
        position: fixed; 
        overflow: hidden; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: pan-y;
        margin: 0;
        padding: 0;
      }
      #root { 
        width: 100%; 
        height: 100%;
        /* Support for safe areas (notched devices) */
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      /* Loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0b141a;
        color: #00a884;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      /* Temporary debug styles - add to your index.css */
      .room-sidebar-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background: rgba(0,0,0,0.5) !important;
        z-index: 9999 !important;
        display: block !important;
      }

      .room-sidebar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        bottom: 0 !important;
        width: 320px !important;
        background: #1a1a1e !important;
        z-index: 10000 !important;
        padding: 20px !important;
        color: white !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="app-loading">
        <div>Loading DevChat Pro...</div>
      </div>
    </div>
  </body>
</html>
